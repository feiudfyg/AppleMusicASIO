[Bridge]
; auto | asio | exclusive | wasapi | monitor | off
; HKCU\Software\AppleMusicASIO\Mode overrides this value when present
Mode=auto
LogLevel=2
; advisory: the bridge never resamples, but may pack float32 into an integer device format
StrictBitPerfect=1
; unity adds no software gain; app applies the app's software volume
VolumeControl=unity
; follow Apple's detected source rate (44.1/48/96/192...) instead of the endpoint rate
FollowSourceRate=1

[ASIO]
; auto = first registered ASIO driver, or a driver name / description / CLSID
Driver=auto
; 0 = stereo / driver native
Channels=0
; 0 = driver preferred
BufferSize=0
; 0 = follow the endpoint mix rate
SampleRate=0

[WASAPI]
; requested exclusive buffer duration (ms); format is negotiated from the endpoint
BufferMs=20
