[Bridge]
; auto | asio | exclusive | monitor | off
Mode=auto
LogLevel=2
; no resampling, no bit-depth conversion: fall back to the normal Windows path instead
StrictBitPerfect=1
; unity keeps the bridge bit-perfect; app applies the app's software volume (float only)
VolumeControl=unity
; follow Apple's detected source rate (44.1/48/96...) instead of the endpoint rate
FollowSourceRate=1

[ASIO]
; auto = first registered ASIO driver, or a driver name / description / CLSID
Driver=auto
; 0 = stereo / driver native
Channels=0
; 0 = driver preferred
BufferSize=0
; 0 = follow the endpoint mix rate
SampleRate=0

[WASAPI]
; requested exclusive buffer duration (ms)
BufferMs=20
